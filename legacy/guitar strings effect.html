<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>🎸 String Vibration Visualizer</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #1a1a2e, #0a0a12);
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  h1 {
    margin-top: 20px;
    font-weight: 300;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(255, 180, 80, 0.6);
  }

  .controls {
    display: flex;
    gap: 15px;
    margin: 15px 0 25px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button, input[type="file"] {
    background: #2a2a40;
    color: #eee;
    border: 1px solid #555;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }

  button:hover {
    background: #3a3a55;
    box-shadow: 0 0 10px rgba(255, 180, 80, 0.4);
  }

  select {
    background: #2a2a40;
    color: #eee;
    border: 1px solid #555;
    padding: 10px;
    border-radius: 8px;
  }

  canvas {
    background: #0d0d18;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 60px rgba(255, 150, 50, 0.05);
    border: 1px solid #2a2a40;
  }

  .status {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
  }
  .legend span { display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>

<h1>🎸 String Vibration Visualizer</h1>

<div class="controls">
  <button id="micBtn">🎤 Use Microphone</button>
  <input type="file" id="fileInput" accept="audio/*" />
  <select id="instrumentSelect">
    <option value="guitar">Guitar (6 strings)</option>
    <option value="veena">Veena / Sitar (with resonance)</option>
    <option value="harp">Harp (12 strings)</option>
  </select>
</div>

<canvas id="visualizer" width="900" height="500"></canvas>

<div class="status" id="status">Status: Idle — select an input source above</div>

<div class="legend">
  <span><span class="dot" style="background:#ff6b6b"></span>Low (Bass)</span>
  <span><span class="dot" style="background:#ffd93d"></span>Mid</span>
  <span><span class="dot" style="background:#6bcBef"></span>High (Treble)</span>
</div>

<audio id="audioPlayer" controls style="margin-top:15px; display:none;"></audio>

<script>
// ============================================================
// AUDIO SETUP
// ============================================================
let audioContext, analyser, dataArray, source;
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const audioPlayer = document.getElementById('audioPlayer');

function initAudioContext() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.6;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }
}

// --- Microphone input ---
document.getElementById('micBtn').addEventListener('click', async () => {
  initAudioContext();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (source) source.disconnect();
    source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    statusEl.textContent = 'Status: 🎤 Listening to microphone...';
  } catch (err) {
    statusEl.textContent = 'Status: Microphone access denied.';
  }
});

// --- File input ---
document.getElementById('fileInput').addEventListener('change', (e) => {
  initAudioContext();
  const file = e.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  audioPlayer.src = url;
  audioPlayer.style.display = 'block';
  audioPlayer.play();

  if (source) source.disconnect();
  source = audioContext.createMediaElementSource(audioPlayer);
  source.connect(analyser);
  analyser.connect(audioContext.destination);

  statusEl.textContent = `Status: ▶ Playing "${file.name}"`;
});

// ============================================================
// STRING PHYSICS SIMULATION
// ============================================================
class VibratingString {
  constructor(label, color, segments = 80, length = 760) {
    this.label = label;
    this.color = color;
    this.segments = segments;
    this.length = length;
    this.amplitude = 0;
    this.targetAmplitude = 0;
    this.phase = Math.random() * 10;
    this.damping = 0.93;
    this.speed = 0.35 + Math.random() * 0.1;
  }

  trigger(inputAmp) {
    this.targetAmplitude = Math.max(this.targetAmplitude, inputAmp);
  }

  update() {
    // Smooth attack, then natural decay
    this.amplitude += (this.targetAmplitude - this.amplitude) * 0.4;
    this.targetAmplitude *= this.damping;
    this.amplitude *= 0.985; // gentle decay even while sustained
    this.phase += this.speed;
  }

  getPoints(maxDisplacement = 45) {
    const points = [];
    for (let i = 0; i <= this.segments; i++) {
      const t = i / this.segments;
      const x = t * this.length;
      const envelope = Math.sin(Math.PI * t); // fixed at both ends (node points)
      // Combine fundamental + a touch of 2nd harmonic for realism
      const wave =
        Math.sin(this.phase + t * 10) * 0.8 +
        Math.sin(this.phase * 2 + t * 20) * 0.2;
      const y = this.amplitude * maxDisplacement * envelope * wave;
      points.push({ x, y });
    }
    return points;
  }
}

// ============================================================
// INSTRUMENT CONFIGURATIONS
// ============================================================
const instruments = {
  guitar: {
    strings: [
      { freq: 82, label: 'E2', color: '#ff6b6b' },
      { freq: 110, label: 'A2', color: '#ff9b6b' },
      { freq: 147, label: 'D3', color: '#ffd93d' },
      { freq: 196, label: 'G3', color: '#9bff6b' },
      { freq: 247, label: 'B3', color: '#6bcBef' },
      { freq: 330, label: 'E4', color: '#6b8bff' }
    ],
    resonance: false
  },
  veena: {
    strings: [
      { freq: 98, label: 'Sa (low)', color: '#ff6b6b' },
      { freq: 147, label: 'Pa', color: '#ffb36b' },
      { freq: 196, label: 'Sa (mid)', color: '#ffd93d' },
      { freq: 294, label: 'Pa (high)', color: '#9bff6b' }
    ],
    resonance: true,
    resonanceStrings: 10 // faint sympathetic strings
  },
  harp: {
    strings: Array.from({ length: 12 }, (_, i) => {
      const freq = 110 * Math.pow(2, i / 12);
      const hue = (i / 12) * 300;
      return {
        freq: Math.round(freq),
        label: `S${i + 1}`,
        color: `hsl(${hue}, 80%, 65%)`
      };
    }),
    resonance: false
  }
};

let currentInstrument = instruments.guitar;
let strings = [];
let resonanceStrings = [];

function buildStrings(config) {
  strings = config.strings.map(
    (s) => new VibratingString(s.label, s.color, 80, canvas.width - 140)
  );

  resonanceStrings = [];
  if (config.resonance) {
    for (let i = 0; i < config.resonanceStrings; i++) {
      resonanceStrings.push(
        new VibratingString(`sym${i}`, 'rgba(255,255,255,0.25)', 60, canvas.width - 220)
      );
    }
  }
}

buildStrings(currentInstrument);

document.getElementById('instrumentSelect').addEventListener('change', (e) => {
  currentInstrument = instruments[e.target.value];
  buildStrings(currentInstrument);
});

// ============================================================
// FREQUENCY → AMPLITUDE MAPPING
// ============================================================
function getAmplitudeNearFrequency(freq) {
  if (!audioContext) return 0;
  const nyquist = audioContext.sampleRate / 2;
  const index = Math.round((freq / nyquist) * (analyser.frequencyBinCount));
  // average a small window around the target bin for stability
  let sum = 0, count = 0;
  for (let i = -2; i <= 2; i++) {
    const idx = index + i;
    if (idx >= 0 && idx < dataArray.length) {
      sum += dataArray[idx];
      count++;
    }
  }
  return count ? (sum / count) / 255 : 0;
}

// ============================================================
// RENDERING
// ============================================================
function drawString(string, yOffset, config, glow = true) {
  const points = string.getPoints();
  const xOffset = (canvas.width - string.length) / 2;

  ctx.beginPath();
  ctx.moveTo(xOffset + points[0].x, yOffset + points[0].y);
  for (const p of points) {
    ctx.lineTo(xOffset + p.x, yOffset + p.y);
  }

  const intensity = Math.min(1, string.amplitude * 2);

  if (glow) {
    ctx.shadowBlur = 15 + intensity * 25;
    ctx.shadowColor = string.color;
  } else {
    ctx.shadowBlur = 0;
  }

  ctx.strokeStyle = string.color;
  ctx.lineWidth = glow ? 2 + intensity * 2 : 1;
  ctx.globalAlpha = glow ? 1 : 0.5 + intensity * 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawLabel(text, x, y, color) {
  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.font = '12px Segoe UI';
  ctx.fillText(text, x, y);
}

function animate() {
  requestAnimationFrame(animate);

  ctx.fillStyle = 'rgba(13,13,24,0.25)'; // trail/fade effect
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (analyser) {
    analyser.getByteFrequencyData(dataArray);
  }

  const spacing = canvas.height / (strings.length + 1);

  strings.forEach((string, i) => {
    const freq = currentInstrument.strings[i].freq;
    const amp = getAmplitudeNearFrequency(freq);

    if (amp > 0.15) {
      string.trigger(amp);

      // Trigger sympathetic resonance strings faintly
      if (currentInstrument.resonance) {
        resonanceStrings.forEach((rs, idx) => {
          if (Math.random() < 0.1) rs.trigger(amp * 0.3);
        });
      }
    }

    string.update();
    const yOffset = spacing * (i + 1);
    drawString(string, yOffset, currentInstrument, true);
    drawLabel(
      `${currentInstrument.strings[i].label}`,
      20,
      yOffset + 4,
      currentInstrument.strings[i].color
    );
  });

  // Draw faint sympathetic resonance strings behind main ones
  if (currentInstrument.resonance) {
    resonanceStrings.forEach((rs, i) => {
      rs.update();
      const yOffset = 30 + i * ((canvas.height - 60) / resonanceStrings.length);
      drawString(rs, yOffset, currentInstrument, false);
    });
  }
}

animate();
</script>
</body>
</html>
